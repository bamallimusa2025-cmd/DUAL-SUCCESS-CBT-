<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUAL SUCCESS CBT</title>
ki<style>
body{font-family:Arial;text-align:center;background:#e8f5e9;padding:15px}
.box{background:white;padding:20px;border-radius:15px;max-width:480px;margin:auto;box-shadow:0 0 12px #aaa}
h1{color:#0a6b2e;font-size:21px;margin:5px}
h2{font-size:17px}
button{width:100%;padding:13px;margin:8px 0;border:none;border-radius:10px;font-size:16px;font-weight:bold;color:white;cursor:pointer}
.green{background:#0a6b2e}.blue{background:#1a56db}.red{background:red}.grey{background:#888}
input,select,textarea{width:92%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.hidden{display:none}
.qbox{text-align:left;background:#f9f9f9;padding:12px;border-radius:10px;margin:10px 0}
label{display:block;margin:4px 0;text-align:left}
</style>
</head>
<body>
<div class="box">
<img src="logo.png" style="width:140px;height:140px;border-radius:50%;border:4px solid gold;object-fit:cover">
<h1>DUAL SUCCESS TAHFEEDH SCHOOL</h1>
<h2>OGBOMOSO - CBT SYSTEM</h2>

<div id="home">
<button class="blue" onclick="show('teacher')">TEACHER LOGIN</button>
<button class="green" onclick="show('student')">STUDENT LOGIN - EXAM</button>
</div>

<div id="teacher" class="hidden">
<h2>Teacher Login</h2>
<input id="tuser" placeholder="Username: DUAL SUCCESS">
<input id="tpass" type="password" placeholder="Password: DUAL@2024">
<button class="blue" onclick="teacherLogin()">LOGIN</button>
<button class="grey" onclick="back()">BACK</button>
<p id="tmsg"></p>
</div>

<div id="teacherDash" class="hidden">
<h2>Teacher Dashboard - Welcome DUAL SUCCESS</h2>
<h3>1. Add Student (Password na kowa DUAL@2024)</h3>
<input id="newName" placeholder="Student Name e.g. Musa Lawal">
<input id="newID" placeholder="Exam No e.g. 9706">
<label><input type="checkbox" id="allow" checked style="width:auto"> Bada dama ya yi Exam (Allow)</label>
<button class="green" onclick="addStudent()">ADD STUDENT</button>
<p id="addMsg"></p>
<div id="studentList"></div>
<hr>
<h3>2. Set Exam Time (Minutes)</h3>
<input id="examTime" type="number" value="20" placeholder="Time in Minutes">
<button class="blue" onclick="saveTime()">SAVE TIME</button>
<hr>
<h3>3. Add Question</h3>
<select id="qSub">
<option>MATHEMATICS</option><option>PHYSICS</option><option>CHEMISTRY</option><option>BIOLOGY</option><option>CIVIC EDUCATION</option><option>AGRICULTURAL SCIENCE</option><option>GEOGRAPHY</option><option>ARABIC</option><option>ISLAMIC STUDIES</option><option>ENGLISH LANGUAGE</option><option>QURAN / TAHFEEDH</option><option>ECONOMICS</option><option>GOVERNMENT</option><option>LITERATURE</option><option>COMPUTER SCIENCE</option><option>HAUSA</option>
</select>
<textarea id="qText" placeholder="Tambaya..."></textarea>
<input id="optA" placeholder="Option A"><input id="optB" placeholder="Option B"><input id="optC" placeholder="Option C"><input id="optD" placeholder="Option D">
<select id="correct"><option value="A">Correct: A</option><option value="B">Correct: B</option><option value="C">Correct: C</option><option value="D">Correct: D</option></select>
<input id="qMark" type="number" value="1" placeholder="Mark e.g. 2">
<button class="green" onclick="addQuestion()">ADD QUESTION</button>
<p id="qMsg"></p>
<div id="qList"></div>
<hr>
<h3>4. Results - Teacher Kadai Yake Gani</h3>
<div id="resultList"></div>
<button class="red" onclick="clearResults()">CLEAR ALL RESULTS</button>
<button class="grey" onclick="back()">LOGOUT</button>
</div>

<div id="student" class="hidden">
<h2>Student Login</h2>
<input id="sname" placeholder="Full Name: Musa Lawal">
<input id="sid" placeholder="Exam No: 9706">
<input id="spass" type="password" placeholder="Password: DUAL@2024">
<button class="green" onclick="studentLogin()">START EXAM</button>
<button class="grey" onclick="back()">BACK</button>
<p id="smsg"></p>
</div>

<div id="exam" class="hidden">
<h2 id="welcomeName"></h2>
<p id="timer" style="color:red;font-weight:bold"></p>
<p><b>Choose Subject:</b></p>
<div id="subBtns"></div>
<div id="examArea"></div>
<button
