<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUAL SUCCESS CBT</title>
<style>
body{font-family:Arial;text-align:center;background:#f0f8f0;padding:20px}
.box{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 0 10px #ccc}
h1{color:#0a6b2e;font-size:22px}
h2{color:#333;font-size:16px}
button{width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;font-size:17px;font-weight:bold;color:white;cursor:pointer}
.green{background:#0a6b2e}.blue{background:#1a56db}
input{width:90%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="box">
<h1>DUAL SUCCESS TAHFEEDH SCHOOL</h1>
<h2>OGBOMOSO - CBT SYSTEM</h2>
<p>Welcome to DUAL SUCCESS CBT Portal</p>

<div id="home">
<button class="blue" onclick="show('teacher')">TEACHER LOGIN</button>
<button class="green" onclick="show('student')">STUDENT LOGIN - EXAM</button>
</div>

<div id="teacher" class="hidden">
<h2>Teacher Login</h2>
<input id="tuser" placeholder="Username: admin">
<input id="tpass" type="password" placeholder="Password: DUAL">
<button class="blue" onclick="teacherLogin()">LOGIN</button>
<button style="background:#888" onclick="back()">BACK</button>
<p id="tmsg"></p>
</div>

<div id="student" class="hidden">
<h2>Student Login</h2>
<input id="sname" placeholder="Full Name: Musa Ahmed">
<input id="sid" placeholder="Student ID: DS001">
<input id="spass" type="password" placeholder="Password: musa123">
<button class="green" onclick="studentLogin()">START EXAM</button>
<button style="background:#888" onclick="back()">BACK</button>
<p id="smsg"></p>
</div>

<div id="exam" class="hidden">
<h2>Welcome Musa Ahmed!</h2>
<p>ID: DS001 | Class: JSS1</p>
<p><b>Choose Subject:</b></p>
<button class="green" onclick="alert('Quran Exam will start now - 20 Questions, 20 Minutes')">QURAN / TAHFEEDH</button>
<button class="green" onclick="alert('Maths Exam will start now')">MATHEMATICS</button>
<button class="green" onclick="alert('English Exam will start now')">ENGLISH</button>
<button style="background:red" onclick="back()">LOGOUT</button>
</div>

</div>
<script>
function show(id){
document.getElementById('home').style.display='none';
document.getElementById('teacher').style.display='none';
document.getElementById('student').style.display='none';
document.getElementById('exam').style.display='none';
document.getElementById(id).style.display='block';
}
function back(){
show('home');
document.getElementById('home').style.display='block';
}
function teacherLogin(){
if(document.getElementById('tuser').value=='admin' && document.getElementById('tpass').value=='DUAL'){
alert('Welcome Teacher! Login Successful');
}else{ document.getElementById('tmsg').innerHTML='Wrong Username or Password! Try admin / DUAL'; }
}
function studentLogin(){
if(document.getElementById('sid').value=='DS001'){
show('exam');
}else{ document.getElementById('smsg').innerHTML='Wrong ID! Try DS001'; }
}
</script>
</body>
</html>
