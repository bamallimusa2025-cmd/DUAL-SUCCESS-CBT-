<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUAL SUCCESS CBT</title>
<style>
body{font-family:Arial;text-align:center;background:#e8f5e9;padding:15px}
.box{background:white;padding:20px;border-radius:15px;max-width:480px;margin:auto}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;font-size:18px;font-weight:bold;color:white}
.blue{background:#1a56db}.green{background:#0a6b2e}.grey{background:#888}
input{width:90%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h1 style="color:#0a6b2e">DUAL SUCCESS TAHFEEDH SCHOOL</h1>
<h2>OGBOMOSO - CBT SYSTEM</h2>

<div id="home">
<button class="blue" onclick="go('teacher')">TEACHER LOGIN</button>
<button class="green" onclick="go('student')">STUDENT LOGIN - EXAM</button>
</div>

<div id="teacher" style="display:none">
<h2>Teacher Login</h2>
<input placeholder="Username: DUAL SUCCESS">
<input type="password" placeholder="Password: DUAL@2024">
<button class="blue" onclick="alert('Teacher Login Works!')">LOGIN</button>
<button class="grey" onclick="go('home')">BACK</button>
</div>

<div id="student" style="display:none">
<h2>Student Login</h2>
<input placeholder="Full Name">
<input placeholder="Exam No">
<input type="password" placeholder="Password: DUAL@2024">
<button class="green" onclick="alert('Student Login Works!')">START EXAM</button>
<button class="grey" onclick="go('home')">BACK</button>
</div>

</div>
<script>
function go(id){
document.getElementById('home').style.display='none';
document.getElementById('teacher').style.display='none';
document.getElementById('student').style.display='none';
document.getElementById(id).style.display='block';
}
</script>
</body>
</html>
