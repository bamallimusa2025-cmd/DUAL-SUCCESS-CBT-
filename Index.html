<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;text-align:center;background:#e8f5e9;padding:20px}.box{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto}button{width:100%;padding:13px;margin:8px 0;border:none;border-radius:10px;color:white;font-weight:bold}.blue{background:#1a56db}.green{background:#0a6b2e}.hidden{display:none}input{width:92%;padding:11px;margin:6px}</style>
</head><body><div class="box">
<img src="logo.png" style="width:110px;height:110px;border-radius:50%;border:4px solid gold">
<h1>DUAL SUCCESS TAHFEEDH SCHOOL</h1>
<div id="home"><button class="blue" onclick="show('teacher')">TEACHER LOGIN</button><button class="green" onclick="show('student')">STUDENT LOGIN</button></div>
<div id="teacher" class="hidden"><h2>Teacher Login</h2><input id="tuser" placeholder="DUAL SUCCESS"><input id="tpass" type="password" placeholder="DUAL@2024"><button class="blue" onclick="alert('YAYI! Button yana aiki. Yanzu zan baka cikakken code a kashi 2')">LOGIN</button><button onclick="show('home')">BACK</button></div>
<div id="student" class="hidden"><h2>Student Login</h2><p>Anan ne Student zai shiga</p><button onclick="show('home')">BACK</button></div>
</div><script>function show(id){document.getElementById('home').style.display='none';document.getElementById('teacher').style.display='none';document.getElementById('student').style.display='none';document.getElementById(id).style.display='block';}</script></body></html>
