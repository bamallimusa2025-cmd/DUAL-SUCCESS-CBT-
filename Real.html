
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUAL SUCCESS CBT</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px;max-width:620px;margin:auto}h1{text-align:center;color:#facc15}.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:0;box-sizing:border-box}button{width:100%;padding:12px;border:0;border-radius:8px;background:#facc15;font-weight:bold;margin:6px 0}button.blue{background:#38bdf8}button.red{background:#ef4444;color:#fff;width:auto;padding:6px 12px}button.green{background:#22c55e}.q{background:#334155;padding:10px;border-radius:8px;margin:8px 0}.hidden{display:none}.ok{color:#4ade80}.err{color:#f87171}</style></head>
<body>
<h1>DUAL SUCCESS CBT</h1><p style="text-align:center">TAHFEEEDH SCHOOL OGBOMOSO</p>
<div id="home" class="card"><h2>Way do you want?</h2><button onclick="show('teacherLogin')">TEACHER LOGIN</button><button class="blue" onclick="show('studentLogin')">STUDENT LOGIN</button></div>

<div id="teacherLogin" class="card hidden"><h2>Teacher Login</h2><input id="tuser" placeholder="Username - DUAL SUCCESS"><input id="tpass" type="password" placeholder="Password - DUAL@2024"><button onclick="tLogin()">LOGIN</button><p id="tmsg"></p><button class="blue" onclick="show('home')">Back</button></div>

<div id="teacherDash" class="card hidden"><h2>Welcome Teacher! ✅</h2>
<h3>Create Exam / Subject</h3><input id="examTitle" placeholder="Subject e.g JSS1 Maths"><input id="examDur" type="number" placeholder="Duration Minutes e.g 30"><textarea id="examQs" rows="6" placeholder="Rubuta tambaya, daya a layi daya:&#10;2+2=? | 3 | 4 | 5 | 6 | B&#10;Capital of Nigeria? | Lagos | Abuja | Kano | Ibadan | B"></textarea><button onclick="saveExam()">SAVE EXAM</button><p id="emsg"></p>
<h3>Exams / Subjects</h3><div id="examList"></div>
<h3>Results - Teacher zai iya gogewa</h3><p style="font-size:13px">Idan student ya koka, danna DELETE a gefen sunansa, zai iya sake rubutawa.</p><div id="resultList"></div>
<button class="blue" onclick="logout()">Logout</button></div>

<div id="studentLogin" class="card hidden"><h2>Student Login</h2><input id="sname" placeholder="Full Name"><input id="sexam" placeholder="Exam Number e.g 001"><input id="spass" type="password" placeholder="Password - 1234"><label>Zabi Subject:</label><select id="subjectSelect"></select><button onclick="sLogin()">START EXAM</button><p id="smsg"></p><button class="blue" onclick="show('home')">Back</button></div>

<div id="takeExam" class="card hidden"><h2 id="takeTitle"></h2><p>Time Left: <b id="timer"></b></p><div id="qsArea"></div><button onclick="submitExam()">SUBMIT EXAM</button></div>
<div id="scoreDiv" class="card hidden"><h2>Result</h2><p id="scoreText"></p><button class="blue" onclick="show('home')">Home</button></div>

<script>
function show(id){['home','teacherLogin','teacherDash','studentLogin','takeExam','scoreDiv'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='studentLogin')loadSubjects()}
function getExams(){return JSON.parse(localStorage.getItem('dual_exams')||'[]')}
function getResults(){return JSON.parse(localStorage.getItem('dual_results')||'[]')}
function tLogin(){let u=document.getElementById('tuser').value.trim();let p=document.getElementById('tpass').value.trim();if(u==='DUAL SUCCESS'&&p==='DUAL@2024'){show('teacherDash');loadTeacher()}else{document.getElementById('tmsg').innerHTML='<span class=err>Username ko Password ba daidai bane</span>'}}
function saveExam(){let t=document.getElementById('examTitle').value.trim();let d=parseInt(document.getElementById('examDur').value)||30;let raw=document.getElementById('examQs').value.trim();if(!t||!raw){document.getElementById('emsg').innerHTML='<span class=err>Ka cika Title da Questions</span>';return}let qs=[];raw.split('\n').forEach(line=>{let p=line.split('|');if(p.length>=6){qs.push({q:p[0].trim(),opts:[p[1].trim(),p[2].trim(),p[3].trim(),p[4].trim()],ans:p[5].trim().toUpperCase())}});let ex=getExams();ex.push({title:t,dur:d,qs:qs});localStorage.setItem('dual_exams',JSON.stringify(ex));document.getElementById('emsg').innerHTML='<span class=ok>Exam ya shiga! ✅</span>';document.getElementById('examTitle').value='';document.getElementById('examQs').value='';loadTeacher()}
function loadTeacher(){let ex=getExams();document.getElementById('examList').innerHTML=ex.length?ex.map((e,i)=>'<div class=q><b>'+e.title+'</b> - '+e.qs.length+' questions - '+e.dur+' mins <br><button class=red onclick="delExam('+i+')">Delete Exam</button></div>').join(''):'Babu exam tukuna';let r=getResults();document.getElementById('resultList').innerHTML=r.length?r.map((x,i)=>'<div class=q>'+x.name+' ('+x.examNo+')<br>'+x.exam+' - <b>'+x.score+'/'+x.total+'</b> <br><button class=red onclick="delResult('+i+')">DELETE - Bada damar sake rubutawa</button></div>').join(''):'Babu result tukuna'}
function delExam(i){if(!confirm('Ka goge wannan exam?'))return;let ex=getExams();ex.splice(i,1);localStorage.setItem('dual_exams',JSON.stringify(ex));loadTeacher()}
function delResult(i){if(!confirm('Ka goge result din wannan student? Zai iya sake login ya sake rubutawa.'))return;let r=getResults();r.splice(i,1);localStorage.setItem('dual_results',JSON.stringify(r));loadTeacher();alert('An goge! Student zai iya sake login yanzu.')}
function loadSubjects(){let ex=getExams();let sel=document.getElementById('subjectSelect');if(!ex.length){sel.innerHTML='<option>Babu exam - Teacher bai yi ba tukuna</option>';return}sel.innerHTML=ex.map((e,i)=>'<option value='+i+'>'+e.title+'</option>').join('')}
let curExam=null,studentName='',studentNo='',secLeft=0,timerInt=null;
function sLogin(){studentName=document.getElementById('sname').value.trim();studentNo=document.getElementById('sexam').value.trim();let pw=document.getElementById('spass').value.trim();let idx=parseInt(document.getElementById('subjectSelect').value);if(!studentName||!studentNo){document.getElementById('smsg').innerHTML='<span class=err>Ka cika suna da exam number</span>';return}let ex=getExams();if(!ex.length||isNaN(idx)){document.getElementById('smsg').innerHTML='<span class=err>Teacher bai yi exam ba tukuna</span>';return}curExam=ex[idx];let res=getResults();let already=res.find(x=>x.name.toLowerCase()===studentName.toLowerCase()&&x.examNo===studentNo&&x.exam===curExam.title);if(already){document.getElementById('smsg').innerHTML='<span class=err>Ka riga ka rubuta '+curExam.title+' - Score ka: '+already.score+'/'+already.total+'. Idan akwai matsala, ka fada wa Teacher ya goge result dinka, sannan ka sake login.</span>';return}show('takeExam');document.getElementById('takeTitle').innerText=curExam.title+' - '+studentName+' ('+studentNo+')';let html='';curExam.qs.forEach((q,i)=>{html+='<div class=q><b>'+(i+1)+'. '+q.q+'</b><br>';['A','B','C','D'].forEach((L,oi)=>{html+='<label><input type=radio name=q'+i+' value='+L+'> '+L+'. '+q.opts[oi]+'</label><br>'});html+='</div>'});document.getElementById('qsArea').innerHTML=html;secLeft=curExam.dur*60;clearInterval(timerInt);timerInt=setInterval(()=>{secLeft--;let m=Math.floor(secLeft/60);let s=secLeft%60;document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;if(secLeft<=0){clearInterval(timerInt);submitExam()}},1000)}
function submitExam(){clearInterval(timerInt);let correct=0;curExam.qs.forEach((q,i)=>{let sel=document.querySelector('input[name=q'+i+']:checked');if(sel&&sel.value===q.ans)correct++});let res=getResults();res.push({name:studentName,examNo:studentNo,exam:curExam.title,score:correct,total:curExam.qs.length});localStorage.setItem('dual_results',JSON.stringify(res));show('scoreDiv');document.getElementById('scoreText').innerHTML='Sunan ka: '+studentName+'<br>Exam No: '+studentNo+'<br>Subject: '+curExam.title+'<br><b>Score: '+correct+' / '+curExam.qs.length+'</b><br><br>Idan ka gama wannan subject, ka koma Home ka zabi wani subject ka sake login.';}
function logout(){show('home')}
</script></body></html>
