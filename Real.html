<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUAL SUCCESS CBT</title>
<style>body{font-family:sans-serif;background:#e8f5e9;color:#111;padding:15px;max-width:620px;margin:auto}h1{text-align:center;color:#166534;font-size:26px;line-height:1.2}.card{background:#fff;padding:22px;border-radius:18px;margin:10px 0;box-shadow:0 4px 20px rgba(0,0,0,0.12)}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:bold;margin:6px 0;font-size:16px}button.teacherBtn{background:#2563eb;color:#fff}button.studentBtn{background:#15803d;color:#fff}button.blue{background:#38bdf8}button.red{background:#ef4444;color:#fff;width:auto;padding:6px 12px}.q{background:#f1f5f9;padding:10px;border-radius:8px;margin:8px 0;color:#111}.hidden{display:none!important}.ok{color:#16a34a}.err{color:#dc2626}.subtitle{text-align:center;color:#000;font-size:24px;font-weight:900;line-height:1.2;margin:10px 0}</style></head>
<body>
<div id="home" class="card"><h1>DUAL SUCCESS TAHFEEDH SCHOOL</h1><div class="subtitle">OGBOMOSO - CBT<br>SYSTEM</div><br><button class="teacherBtn" onclick="go('teacherLogin')">TEACHER LOGIN</button><button class="studentBtn" onclick="go('studentLogin')">STUDENT LOGIN - EXAM</button></div>
<div id="teacherLogin" class="card hidden"><h2 style="color:#111">Teacher Login</h2><input id="tuser" placeholder="Username"><input id="tpass" type="password" placeholder="Password"><button class="teacherBtn" onclick="tLogin()">LOGIN</button><p id="tmsg"></p><button class="blue" onclick="go('home')">Back</button></div>
<div id="teacherDash" class="card hidden"><h2 style="color:#111">Welcome Teacher! ✅</h2><h3 style="color:#111">Create Exam / Subject</h3><input id="examTitle" placeholder="Subject e.g JSS1 Maths"><input id="examDur" type="number" placeholder="Duration Minutes e.g 30"><textarea id="examQs" rows="6" placeholder="Type question, one per line: 2+2=? | 3 | 4 | 5 | 6 | B"></textarea><button class="teacherBtn" onclick="saveExam()">SAVE EXAM</button><p id="emsg"></p><h3 style="color:#111">Exams / Subjects</h3><div id="examList"></div><h3 style="color:#111">Results</h3><div id="resultList"></div><button class="blue" onclick="logout()">Logout</button></div>
<div id="studentLogin" class="card hidden"><h2 style="color:#111">Student Login</h2><input id="sname" placeholder="Full Name"><input id="sexam" placeholder="Exam Number"><input id="spass" type="password" placeholder="Password"><label style="color:#111">Select Subject:</label><select id="subjectSelect"></select><button class="studentBtn" onclick="sLogin()">START EXAM</button><p id="smsg"></p><button class="blue" onclick="go('home')">Back</button></div>
<div id="takeExam" class="card hidden"><h2 id="takeTitle" style="color:#111"></h2><p style="color:#111">Time Left: <b id="timer"></b></p><div id="qsArea"></div><button class="studentBtn" onclick="submitExam()">SUBMIT EXAM</button></div>
<div id="scoreDiv" class="card hidden"><h2 style="color:#111">Result</h2><p id="scoreText" style="color:#111"></p><button class="blue" onclick="go('home')">Home</button></div>
<script>
function go(id){var all=['home','teacherLogin','teacherDash','studentLogin','takeExam','scoreDiv'];for(var i=0;i<all.length;i++){document.getElementById(all[i]).classList.add('hidden');}document.getElementById(id).classList.remove('hidden');if(id==='studentLogin'){loadSubjects();}window.scrollTo(0,0);}
function getExams(){return JSON.parse(localStorage.getItem('dual_exams')||'[]');}
function getResults(){return JSON.parse(localStorage.getItem('dual_results')||'[]');}
function tLogin(){var u=document.getElementById('tuser').value.trim();var p=document.getElementById('tpass').value.trim();if(u==='DUAL SUCCESS'&&p==='DUAL@2024'){go('teacherDash');loadTeacher();}else{document.getElementById('tmsg').innerHTML='<span class=err>Wrong Username or Password</span>';}}
function saveExam(){var t=document.getElementById('examTitle').value.trim();var d=parseInt(document.getElementById('examDur').value)||30;var raw=document.getElementById('examQs').value.trim();if(!t||!raw){document.getElementById('emsg').innerHTML='<span class=err>Fill Title and Questions</span>';return;}var qs=[];raw.split('\n').forEach(function(line){var p=line.split('|');if(p.length>=6){qs.push({q:p[0].trim(),opts:[p[1].trim(),p[2].trim(),p[3].trim(),p[4].trim()],ans:p[5].trim().toUpperCase()});}});var ex=getExams();ex.push({title:t,dur:d,qs:qs});localStorage.setItem('dual_exams',JSON.stringify(ex));document.getElementById('emsg').innerHTML='<span class=ok>Exam Saved! ✅</span>';document.getElementById('examTitle').value='';document.getElementById('examQs').value='';loadTeacher();}
function loadTeacher(){var ex=getExams();document.getElementById('examList').innerHTML=ex.length?ex.map(function(e,i){return '<div class=q><b>'+e.title+'</b> - '+e.qs.length+' questions - '+e.dur+' mins <br><button class=red onclick="delExam('+i+')">Delete Exam</button></div>';}).join(''):'No exam yet';var r=getResults();document.getElementById('resultList').innerHTML=r.length?r.map(function(x,i){return '<div class=q>'+x.name+' ('+x.examNo+')<br>'+x.exam+' - <b>'+x.score+'/'+x.total+'</b> <br><button class=red onclick="delResult('+i+')">DELETE - Allow Retake</button></div>';}).join(''):'No result yet';}
function delExam(i){if(!confirm('Delete this exam?'))return;var ex=getExams();ex.splice(i,1);localStorage.setItem('dual_exams',JSON.stringify(ex));loadTeacher();}
function delResult(i){if(!confirm('Delete this result? Student can login again.'))return;var r=getResults();r.splice(i,1);localStorage.setItem('dual_results',JSON.stringify(r));loadTeacher();alert('Deleted! Student can login again.');}
function loadSubjects(){var ex=getExams();var sel=document.getElementById('subjectSelect');if(!ex.length){sel.innerHTML='<option>No exam - Teacher has not created yet</option>';return;}sel.innerHTML=ex.map(function(e,i){return '<option value='+i+'>'+e.title+'</option>';}).join('');}
var curExam=null,studentName='',studentNo='',secLeft=0,timerInt=null;
function sLogin(){studentName=document.getElementById('sname').value.trim();studentNo=document.getElementById('sexam').value.trim();var spass=document.getElementById('spass').value.trim();var idx=parseInt(document.getElementById('subjectSelect').value);if(!studentName||!studentNo){document.getElementById('smsg').innerHTML='<span class=err>Fill name and exam number</span>';return;}if(spass!=='DUAL@2024'){document.getElementById('smsg').innerHTML='<span class=err>Wrong Password</span>';return;}var ex=getExams();if(!ex.length||isNaN(idx)){document.getElementById('smsg').innerHTML='<span class=err>Teacher has not created exam yet</span>';return;}curExam=ex[idx];var res=getResults();var already=null;for(var k=0;k<res.length;k++){if(res[k].name.toLowerCase()===studentName.toLowerCase()&&res[k].examNo===studentNo&&res[k].exam===curExam.title){already=res[k];}}if(already){document.getElementById('smsg').innerHTML='<span class=err>You already wrote '+curExam.title+' - Score: '+already.score+'/'+already.total+'. Tell Teacher to delete your result.</span>';return;}go('takeExam');document.getElementById('takeTitle').innerText=curExam.title+' - '+studentName+' ('+studentNo+')';var html='';curExam.qs.forEach(function(q,i){html+='<div class=q><b>'+(i+1)+'. '+q.q+'</b><br>';['A','B','C','D'].forEach(function(L,oi){html+='<label><input type=radio name=q'+i+' value='+L+'> '+L+'. '+q.opts[oi]+'</label><br>';});html+='</div>';});document.getElementById('qsArea').innerHTML=html;secLeft=curExam.dur*60;clearInterval(timerInt);timerInt=setInterval(function(){secLeft--;var m=Math.floor(secLeft/60);var s=secLeft%60;document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;if(secLeft<=0){clearInterval(timerInt);submitExam();}},1000);}
function submitExam(){clearInterval(timerInt);var correct=0;curExam.qs.forEach(function(q,i){var sel=document.querySelector('input[name=q'+i+']:checked');if(sel&&sel.value===q.ans)correct++;});var res=getResults();res.push({name:studentName,examNo:studentNo,exam:curExam.title,score:correct,total:curExam.qs.length});localStorage.setItem('dual_results',JSON.stringify(res));go('scoreDiv');document.getElementById('scoreText').innerHTML='Name: '+studentName+'<br>Exam No: '+studentNo+'<br>Subject: '+curExam.title+'<br><b>Score: '+correct+' / '+curExam.qs.length+'</b>';}
function logout(){go('home');}
</script></body></html>
