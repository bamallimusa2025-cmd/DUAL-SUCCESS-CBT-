<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUAL SUCCESS CBT</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px;max-width:620px;margin:auto}h1{text-align:center;color:#facc15}.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:0;box-sizing:border-box}button{width:100%;padding:12px;border:0;border-radius:8px;background:#facc15;font-weight:bold;margin:6px 0}button.blue{background:#38bdf8}button.red{background:#ef4444;color:#fff;width:auto;padding:6px 12px}.q{background:#334155;padding:10px;border-radius:8px;margin:8px 0}.hidden{display:none!important}.ok{color:#4ade80}.err{color:#f87171}</style></head>
<body>
<h1>DUAL SUCCESS CBT</h1><p style="text-align:center">TAHFEEEDH SCHOOL OGBOMOSO</p>
<div id="home" class="card"><h2>Way do you want?</h2><button onclick="go('teacherLogin')">TEACHER LOGIN</button><button class="blue" onclick="go('studentLogin')">STUDENT LOGIN</button></div>
<div id="teacherLogin" class="card hidden"><h2>Teacher Login</h2><input id="tuser" placeholder="Username - DUAL SUCCESS"><input id="tpass" type="password" placeholder="Password - DUAL@2024"><button onclick="tLogin()">LOGIN</button><p id="tmsg"></p><button class="blue" onclick="go('home')">Back</button></div>
<div id="teacherDash" class="card hidden"><h2>Welcome Teacher! ✅</h2><h3>Create Exam / Subject</h3><input id="examTitle" placeholder="Subject e.g JSS1 Maths"><input id="examDur" type="number" placeholder="Duration Minutes e.g 30"><textarea id="examQs" rows="6" placeholder="Rubuta tambaya, daya a layi daya: 2+2=? | 3 | 4 | 5 | 6 | B"></textarea><button onclick="saveExam()">SAVE EXAM</button><p id="emsg"></p><h3>Exams / Subjects</h3><div id="examList"></div><h3>Results - Teacher zai iya gogewa</h3><p style="font-size:13px">Idan student ya koka, danna DELETE a gefen sunansa, zai iya sake rubutawa.</p><div id="resultList"></div><button class="blue" onclick="logout()">Logout</button></div>
<div id="studentLogin" class="card hidden"><h2>Student Login</h2><input id="sname" placeholder="Full Name"><input id="sexam" placeholder="Exam Number e.g 001"><input id="spass" type="password" placeholder="Password - 1234"><label>Zabi Subject:</label><select id="subjectSelect"></select><button onclick="sLogin()">START EXAM</button><p id="smsg"></p><button class="blue" onclick="go('home')">Back</button></div>
<div id="takeExam" class="card hidden"><h2 id="takeTitle"></h2><p>Time Left: <b id="timer"></b></p><div id="qsArea"></div><button onclick="submitExam()">SUBMIT EXAM</button></div>
<div id="scoreDiv" class="card hidden"><h2>Result</h2><p id="scoreText"></p><button class="blue" onclick="go('home')">Home</button></div>
<script>
function go(id){var all=['home','teacherLogin','teacherDash','studentLogin','takeExam','scoreDiv'];for(var i=0;i<all.length;i++){document.getElementById(all[i]).classList.add('hidden');}document.getElementById(id).classList.remove
